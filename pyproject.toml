[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clawshop"
version = "0.1.0"
description = "ClawShop vertical-slice prototype: cross-retailer agentic personal shopper (PRD §6.1)"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
clawshop = "clawshop.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["clawshop*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
